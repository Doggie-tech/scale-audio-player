<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>语音引导卡</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef3f4;
      --muted: rgba(238, 243, 244, .58);
      --glass: rgba(18,24,32,.58);
      --glass-2: rgba(20,28,38,.42);
      --line: rgba(255,255,255,.16);
      --line-dark: rgba(255,255,255,.10);
      --blue: #6078c8;
      --violet: #8c6cc8;
      --pink: #b36a88;
      --orange: #b98255;
      --yellow: #c3aa63;
      --green: #5b9b83;
      --danger: #e38a9a;
      --ok: #70c7a6;
      --shadow: 0 24px 90px rgba(0,0,0,.34);
      --soft-shadow: 0 12px 36px rgba(0,0,0,.22);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 16%, rgba(179,106,136,.24), transparent 28%),
        radial-gradient(circle at 82% 13%, rgba(195,170,99,.22), transparent 30%),
        radial-gradient(circle at 78% 82%, rgba(91,155,131,.20), transparent 32%),
        radial-gradient(circle at 18% 86%, rgba(96,120,200,.20), transparent 30%),
        linear-gradient(135deg, #101419, #17202a 42%, #19171d 72%, #101815);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      background:
        conic-gradient(from 150deg at 50% 50%, rgba(255,255,255,.22), rgba(179,106,136,.16), rgba(255,255,255,.18), rgba(96,120,200,.16), rgba(195,170,99,.16), rgba(91,155,131,.14), rgba(255,255,255,.20));
      filter: blur(64px);
      opacity: .58;
      animation: metalFlow 18s ease-in-out infinite alternate;
    }

    @keyframes metalFlow {
      from { transform: translate3d(-3%, -2%, 0) rotate(-5deg) scale(1); }
      to { transform: translate3d(3%, 2%, 0) rotate(7deg) scale(1.05); }
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 18px;
      min-height: 46px;
      padding: 11px 15px;
      background: rgba(255,255,255,.10);
      color: var(--ink);
      font-weight: 760;
      box-shadow: 0 8px 22px rgba(0,0,0,.16);
      backdrop-filter: blur(18px) saturate(145%);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .42; cursor: not-allowed; }

    .primary {
      border-color: rgba(255,255,255,.84);
      background: linear-gradient(135deg, #6f88e8, #9a74c9 52%, #c4a664);
      color: #fff;
    }

    .danger {
      background: rgba(227,138,154,.14);
      color: var(--danger);
    }

    .subtle {
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: rgba(238,243,244,.70);
      box-shadow: none;
      font-size: 13px;
    }

    .ok {
      background: rgba(112,199,166,.14);
      color: var(--ok);
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 14px;
      background: rgba(255,255,255,.10);
      color: var(--ink);
      outline: none;
      backdrop-filter: blur(16px);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.55;
    }

    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    .topbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--glass-2);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(24px) saturate(160%);
    }

.topbar.visible { display: none; }

    .brand {
      min-width: 0;
    }

    .brand b {
      display: block;
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .screen {
      min-height: 0;
      display: none;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 32px;
      background: rgba(18,24,32,.44);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(165%);
    }

    .screen.active { display: block; }

    .cover {
      display: none;
      position: relative;
      height: 100%;
      min-height: calc(100vh - 28px);
      padding: clamp(24px, 6vw, 72px);
      overflow: hidden;
    }

    .cover.active { display: grid; }

    .cover::after {
      content: "";
      position: absolute;
      right: clamp(24px, 8vw, 96px);
      top: 13%;
      width: min(48vw, 520px);
      aspect-ratio: 1;
      border-radius: 44% 56% 52% 48%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,.96), transparent 20%),
        conic-gradient(from 210deg, #ffffff, #b94d7a, #d0b24a, #3f9b73, #426fbd, #7258b8, #ffffff);
      box-shadow: inset 0 0 52px rgba(255,255,255,.62), inset -36px -48px 80px rgba(54,68,88,.20), 0 34px 110px rgba(66,111,189,.16);
      filter: saturate(120%);
      animation: blob 10s ease-in-out infinite alternate;
    }

    @keyframes blob {
      from { transform: rotate(-8deg) translateY(8px); border-radius: 44% 56% 52% 48%; }
      to { transform: rotate(9deg) translateY(-10px); border-radius: 58% 42% 47% 53%; }
    }

    .cover-content {
      position: relative;
      z-index: 1;
      align-self: end;
      max-width: 760px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 760;
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 18px 0 14px;
      font-size: clamp(46px, 8vw, 104px);
      line-height: .92;
      letter-spacing: 0;
    }

    .cover p {
      max-width: 620px;
      margin: 0 0 24px;
      color: rgba(21,25,27,.70);
      font-size: clamp(17px, 2.1vw, 24px);
      line-height: 1.5;
    }

    .cover-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 14px;
      height: 100%;
      padding: 14px;
    }

    .panel {
      min-height: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgba(18,24,32,.46);
      backdrop-filter: blur(22px) saturate(150%);
      overflow: auto;
    }

    .library-panel {
      max-width: 260px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    h2, h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h2 { font-size: 24px; }
    h3 { font-size: 18px; }

    .list {
      display: grid;
      gap: 9px;
    }

    .row-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 68px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.60);
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      text-align: left;
      box-shadow: 0 8px 24px rgba(29,39,52,.08);
    }

    .row-card.active {
      outline: 2px solid rgba(63,124,255,.44);
      background: rgba(255,255,255,.14);
    }

    .row-card strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-card span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pill {
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 12px;
      color: rgba(21,25,27,.62);
      background: rgba(21,25,27,.08);
      white-space: nowrap;
    }

    .pill.ready {
      color: var(--ok);
      background: rgba(35,210,150,.22);
    }

    .editor {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
      min-height: 100%;
    }

    .section-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(20px) saturate(150%);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }

    .field label {
      display: block;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .compact-audio .actions {
      justify-content: flex-end;
      gap: 6px;
    }

    .compact-audio button {
      min-height: 36px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    audio {
      width: 100%;
      display: none;
    }

    .audio-info {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
    }

    .options-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .item-stage {
      display: grid;
      gap: 12px;
      min-height: 100%;
    }

    .item-card-main {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,.10);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(22px) saturate(150%);
      touch-action: pan-y;
      animation: cardIn .18s ease both;
    }

    @keyframes cardIn {
      from { opacity: .72; transform: translateX(10px) scale(.995); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }

    .item-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .item-title-row h2 {
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.02;
    }

    .item-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .item-strip button {
      min-width: 96px;
      border-radius: 999px;
      padding: 10px 12px;
      white-space: nowrap;
    }

    .option-stack {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(21,25,27,.08);
    }

    .option-card {
      padding: 12px;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 22px;
      background: rgba(255,255,255,.08);
    }

    .option-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .option-card-head h3 {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .manage-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 240px;
      border: 1px dashed rgba(21,25,27,.18);
      border-radius: 24px;
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(235,240,246,.44);
      backdrop-filter: blur(18px);
    }

    .modal.active { display: grid; }

    .dialog {
      width: min(520px, 100%);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(22,28,36,.86);
      box-shadow: var(--shadow);
      backdrop-filter: blur(28px) saturate(160%);
    }

    .dialog h3 { margin-bottom: 12px; }

    .dialog .actions {
      justify-content: flex-end;
      margin-top: 14px;
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .screen { overflow: visible; }
      .workspace { grid-template-columns: 1fr; height: auto; }
      .library-panel { display: none; }
      .panel { overflow: visible; }
      .grid-2, .option-grid { grid-template-columns: 1fr; }
      .cover { min-height: calc(100vh - 28px); }
      .cover::after { width: 74vw; right: -18vw; top: 9%; opacity: .72; }
      .cover-content { align-self: end; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar" id="topbar">
      <div class="brand">
        <b>语音引导卡</b>
        <span id="crumb">资料库</span>
      </div>
      <div class="top-actions">
        <button id="coverBtn">封面</button>
        <button class="primary" id="newScaleTopBtn">新增量表</button>
      </div>
    </header>

    <section class="cover active" id="coverScreen">
      <div class="cover-content">
        <span class="eyebrow">Voice Guide</span>
        <h1>语音引导卡</h1>
        <p>输入文字，滑动播放。</p>
        <div class="cover-actions">
          <button class="primary" id="enterBtn">进入资料库</button>
          <button id="coverNewBtn">新建第一个量表</button>
        </div>
      </div>
    </section>

    <main class="screen" id="mainScreen">
      <div class="workspace">
        <aside class="panel library-panel">
          <div class="panel-head">
            <h2>量表</h2>
            <button class="primary" id="newScaleBtn">新增</button>
          </div>
          <div class="list" id="scaleList"></div>
        </aside>

        <section class="panel">
          <div class="editor" id="editor"></div>
        </section>
      </div>
    </main>
  </div>

  <div class="modal" id="textModal">
    <div class="dialog">
      <h3 id="modalTitle">新增</h3>
      <div class="field">
        <label for="modalInput">名称</label>
        <input id="modalInput" placeholder="输入名称">
      </div>
      <div class="actions">
        <button id="modalCancel">取消</button>
        <button class="primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      db: null,
      scales: [],
      selectedScaleId: null,
      selectedItemId: null,
      selectedOptionId: null,
      modalResolve: null,
      playingKey: null,
      activeAudio: null,
      mediaRecorder: null,
      chunks: [],
      currentAudioTarget: null,
      touchStartX: 0,
      touchStartY: 0
    };

    const $ = (id) => document.getElementById(id);
    const uid = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;

    function requestToPromise(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("custom-scale-audio-player", 2);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains("data")) db.createObjectStore("data", { keyPath: "id" });
          if (!db.objectStoreNames.contains("clips")) db.createObjectStore("clips", { keyPath: "key" });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    const store = (name, mode = "readonly") => state.db.transaction(name, mode).objectStore(name);

    async function saveData() {
      await requestToPromise(store("data", "readwrite").put({ id: "library", scales: state.scales }));
    }

    async function loadData() {
      const saved = await requestToPromise(store("data").get("library"));
      state.scales = saved?.scales || [];
    }

    function selectedScale() {
      return state.scales.find((scale) => scale.id === state.selectedScaleId) || null;
    }

    function selectedItem() {
      return selectedScale()?.items.find((item) => item.id === state.selectedItemId) || null;
    }

    function selectedOption() {
      return selectedItem()?.options.find((option) => option.id === state.selectedOptionId) || null;
    }

    function selectedItemIndex() {
      const scale = selectedScale();
      if (!scale || !state.selectedItemId) return -1;
      return scale.items.findIndex((item) => item.id === state.selectedItemId);
    }

    function showCover() {
      $("coverScreen").classList.add("active");
      $("mainScreen").classList.remove("active");
      $("topbar").classList.remove("visible");
    }

    function showMain() {
      $("coverScreen").classList.remove("active");
      $("mainScreen").classList.add("active");
      $("topbar").classList.remove("visible");
      render();
    }

    function openTextModal(title, placeholder = "输入名称") {
      $("modalTitle").textContent = title;
      $("modalInput").value = "";
      $("modalInput").placeholder = placeholder;
      $("textModal").classList.add("active");
      $("modalInput").focus();
      return new Promise((resolve) => {
        state.modalResolve = resolve;
      });
    }

    function closeTextModal(value = null) {
      $("textModal").classList.remove("active");
      if (state.modalResolve) state.modalResolve(value);
      state.modalResolve = null;
    }

    async function addScale() {
      const name = await openTextModal("新增量表", "例如：MoCA、MMSE、汉密尔顿");
      if (!name) return;
      const scale = { id: uid("scale"), name, items: [] };
      state.scales.push(scale);
      state.selectedScaleId = scale.id;
      state.selectedItemId = null;
      state.selectedOptionId = null;
      await saveData();
      showMain();
    }

    async function addItem() {
      const scale = selectedScale();
      if (!scale) return;
      const name = await openTextModal("新增条目", "例如：定向力-时间");
      if (!name) return;
      const item = { id: uid("item"), name, options: [] };
      scale.items.push(item);
      state.selectedItemId = item.id;
      state.selectedOptionId = null;
      await saveData();
      render();
    }

    async function addOption() {
      const item = selectedItem();
      if (!item) return;
      const name = await openTextModal("新增选项", "例如：提示语A、重复说明、练习项");
      if (!name) return;
      const option = { id: uid("option"), name };
      item.options.push(option);
      state.selectedOptionId = option.id;
      await saveData();
      render();
    }

    async function renameCurrent(type) {
      const target = type === "scale" ? selectedScale() : type === "item" ? selectedItem() : selectedOption();
      if (!target) return;
      const name = await openTextModal("重命名", target.name);
      if (!name) return;
      target.name = name;
      await saveData();
      render();
    }

    async function removeCurrent(type) {
      if (type === "option") {
        const item = selectedItem();
        if (!item || !selectedOption()) return;
        if (!confirm("确定删除当前选项？")) return;
        item.options = item.options.filter((option) => option.id !== state.selectedOptionId);
        state.selectedOptionId = item.options[0]?.id || null;
      }
      if (type === "item") {
        const scale = selectedScale();
        const item = selectedItem();
        if (!scale || !item) return;
        if (!confirm("确定删除当前条目和它的选项？")) return;
        scale.items = scale.items.filter((entry) => entry.id !== item.id);
        state.selectedItemId = scale.items[0]?.id || null;
        state.selectedOptionId = selectedItem()?.options[0]?.id || null;
      }
      if (type === "scale") {
        const scale = selectedScale();
        if (!scale) return;
        if (!confirm("确定删除当前量表和全部条目？")) return;
        state.scales = state.scales.filter((entry) => entry.id !== scale.id);
        state.selectedScaleId = state.scales[0]?.id || null;
        state.selectedItemId = selectedScale()?.items[0]?.id || null;
        state.selectedOptionId = selectedItem()?.options[0]?.id || null;
      }
      await saveData();
      render();
    }

    async function saveNote(type, value) {
      const target = type === "item" ? selectedItem() : selectedOption();
      if (!target) return;
      target.note = value;
      await saveData();
    }

    function targetByType(type, id) {
      if (type === "item") return selectedScale()?.items.find((item) => item.id === id) || null;
      return selectedScale()?.items.flatMap((item) => item.options).find((option) => option.id === id) || null;
    }

    function audioKey(type, id) {
      return `${type}:${id}`;
    }

    async function getClip(type, id) {
      return requestToPromise(store("clips").get(audioKey(type, id)));
    }

    async function putClip(type, id, file, name = file.name) {
      await requestToPromise(store("clips", "readwrite").put({
        key: audioKey(type, id),
        name,
        size: file.size,
        type: file.type || "audio/webm",
        blob: file,
        updatedAt: new Date().toISOString()
      }));
    }

    function stopActiveAudio() {
      if (!state.activeAudio) return;
      state.activeAudio.onended = null;
      state.activeAudio.onerror = null;
      state.activeAudio.pause();
      state.activeAudio = null;
      state.playingKey = null;
    }

    async function playAudio(type, id, interrupt = false) {
      const key = audioKey(type, id);
      if (state.playingKey) {
        if (!interrupt) return;
        stopActiveAudio();
      }
      const clip = await getClip(type, id);
      if (!clip) return;
      const url = URL.createObjectURL(clip.blob);
      const audio = new Audio(url);
      state.playingKey = key;
      state.activeAudio = audio;
      render();
      const cleanup = () => {
        URL.revokeObjectURL(url);
        state.playingKey = null;
        state.activeAudio = null;
        render();
      };
      audio.onended = cleanup;
      audio.onerror = cleanup;
      audio.play().catch(cleanup);
    }

    async function startRecording(type, id, label) {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
        alert("当前浏览器不支持网页录音。");
        return;
      }
      state.currentAudioTarget = { type, id };
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.chunks = [];
      state.mediaRecorder = new MediaRecorder(stream);
      state.mediaRecorder.ondataavailable = (event) => {
        if (event.data.size) state.chunks.push(event.data);
      };
      state.mediaRecorder.onstop = async () => {
        stream.getTracks().forEach((track) => track.stop());
        const blob = new Blob(state.chunks, { type: state.mediaRecorder.mimeType || "audio/webm" });
        const file = new File([blob], `${label}-录音.webm`, { type: blob.type });
        await putClip(type, id, file, file.name);
        state.currentAudioTarget = null;
        render();
      };
      state.mediaRecorder.start();
      render();
    }

    function stopRecording() {
      if (!state.mediaRecorder || state.mediaRecorder.state === "inactive") return;
      state.mediaRecorder.stop();
    }

    async function renderAudioControls(container, type, id, label, compact = false) {
      const target = targetByType(type, id);
      const clip = await getClip(type, id);
      const isRecording = state.currentAudioTarget?.type === type && state.currentAudioTarget?.id === id;
      const isPlaying = state.playingKey === audioKey(type, id);
      const isAnyPlaying = Boolean(state.playingKey);
      const playLabel = type === "item" ? "播放引导" : "播放";
      container.innerHTML = `
        <div class="${compact ? "compact-audio" : ""}">
          <div class="actions">
            <button class="${clip ? "primary" : ""}" data-action="play" ${clip && !isAnyPlaying && !isRecording ? "" : "disabled"}>${isPlaying ? "播放中" : playLabel}</button>
            <button class="${!clip ? "primary" : ""} ${isRecording ? "danger" : ""}" data-action="record" ${isRecording || isAnyPlaying ? "disabled" : ""}>${isRecording ? "录音中" : clip ? "重录" : "录音"}</button>
            <button data-action="stop" ${isRecording ? "" : "disabled"}>停止</button>
          </div>
        </div>
      `;
      container.querySelector('[data-action="play"]').addEventListener("click", () => playAudio(type, id));
      container.querySelector('[data-action="record"]').addEventListener("click", () => startRecording(type, id, target?.name || label));
      container.querySelector('[data-action="stop"]').addEventListener("click", stopRecording);
    }

    function renderScales() {
      $("scaleList").innerHTML = state.scales.length ? state.scales.map((scale) => {
        const itemCount = scale.items.length;
        const optionCount = scale.items.reduce((sum, item) => sum + item.options.length, 0);
        return `<div class="row-card ${scale.id === state.selectedScaleId ? "active" : ""}" data-id="${scale.id}">
          <span><strong>${escapeHtml(scale.name)}</strong><span>${itemCount} 个条目 · ${optionCount} 个选项</span></span>
          <span class="manage-actions">
            <button class="subtle" data-action="open-scale" data-id="${scale.id}">打开</button>
            <button class="subtle" data-action="rename-scale" data-id="${scale.id}">重命名</button>
            <button class="subtle danger" data-action="delete-scale" data-id="${scale.id}">删除</button>
          </span>
        </div>`;
      }).join("") : `<div class="empty">还没有量表<br>点“新增”开始。</div>`;

      document.querySelectorAll('[data-action="open-scale"]').forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedScaleId = button.dataset.id;
          const scale = selectedScale();
          state.selectedItemId = scale.items[0]?.id || null;
          state.selectedOptionId = selectedItem()?.options[0]?.id || null;
          render();
        });
      });
      document.querySelectorAll('[data-action="rename-scale"]').forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedScaleId = button.dataset.id;
          renameCurrent("scale");
        });
      });
      document.querySelectorAll('[data-action="delete-scale"]').forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedScaleId = button.dataset.id;
          removeCurrent("scale");
        });
      });
    }

    async function renderEditor() {
      const scale = selectedScale();
      if (!scale) {
        $("editor").innerHTML = `<div class="empty">选择或新增一个量表。</div>`;
        return;
      }

      const item = selectedItem();
      $("crumb").textContent = item ? `${scale.name} / ${item.name}` : scale.name;
      const itemIndex = selectedItemIndex();
      const total = scale.items.length;

      $("editor").innerHTML = `
        <div class="item-stage">
          ${item ? `
            <div class="item-card-main" id="swipeItemCard">
              <div class="item-title-row">
                <div>
                  <h2>${escapeHtml(item.name)}</h2>
                </div>
                <div class="manage-actions">
                  <button class="subtle" id="renameItemBtn">重命名</button>
                  <button class="subtle danger" id="deleteItemBtn">删除</button>
                </div>
              </div>
              <div id="itemAudioBox"></div>
              <div class="options-head" style="margin-top:14px">
                <h3>选项</h3>
                <button class="subtle" id="addOptionBtn">新增选项</button>
              </div>
              <div class="option-stack" id="optionStack"></div>
              <div class="actions" style="margin-top:10px">
                <button class="subtle" id="addItemBtn">新增条目</button>
              </div>
            </div>
          ` : `<div class="empty">还没有条目。<br><button class="primary" id="emptyAddItemBtn">新增第一条</button></div>`}
        </div>
      `;

      $("addItemBtn")?.addEventListener("click", addItem);
      $("emptyAddItemBtn")?.addEventListener("click", addItem);

      if (item) {
        $("addOptionBtn").addEventListener("click", addOption);
        $("renameItemBtn").addEventListener("click", () => renameCurrent("item"));
        $("deleteItemBtn").addEventListener("click", () => removeCurrent("item"));
        attachSwipe($("swipeItemCard"));
        await renderAudioControls($("itemAudioBox"), "item", item.id, item.name);
        await renderOptionStack(item);
      }
    }

    async function renderOptionStack(item) {
      if (!item) {
        $("optionStack").innerHTML = `<div class="empty">先选择条目。</div>`;
        return;
      }

      const options = [];
      for (let index = 0; index < item.options.length; index += 1) {
        const option = item.options[index];
        options.push(`
          <div class="option-card" data-id="${option.id}">
            <div class="option-card-head">
              <h3>${index + 1}. ${escapeHtml(option.name)}</h3>
              <div class="manage-actions">
                <button class="subtle" data-action="rename-option" data-id="${option.id}">重命名</button>
                <button class="subtle danger" data-action="delete-option" data-id="${option.id}">删除</button>
              </div>
            </div>
            <div id="optionAudio-${option.id}"></div>
          </div>
        `);
      }
      $("optionStack").innerHTML = options.length ? options.join("") : `<div class="empty">没有选项</div>`;

      for (const option of item.options) {
        await renderAudioControls($(`optionAudio-${option.id}`), "option", option.id, option.name, true);
      }
      document.querySelectorAll('[data-action="rename-option"]').forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedOptionId = button.dataset.id;
          renameCurrent("option");
        });
      });
      document.querySelectorAll('[data-action="delete-option"]').forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedOptionId = button.dataset.id;
          removeCurrent("option");
        });
      });
    }

    function moveItem(delta, autoPlay = false) {
      const scale = selectedScale();
      const index = selectedItemIndex();
      if (!scale || index < 0) return;
      const nextIndex = Math.max(0, Math.min(scale.items.length - 1, index + delta));
      if (nextIndex === index) return;
      if (autoPlay) stopActiveAudio();
      state.selectedItemId = scale.items[nextIndex].id;
      state.selectedOptionId = scale.items[nextIndex].options[0]?.id || null;
      render();
      if (autoPlay) {
        requestAnimationFrame(() => {
          setTimeout(() => playAudio("item", scale.items[nextIndex].id, true), 40);
        });
      }
    }

    function attachSwipe(element) {
      element.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        state.touchStartX = touch.clientX;
        state.touchStartY = touch.clientY;
      }, { passive: true });

      element.addEventListener("touchend", (event) => {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - state.touchStartX;
        const dy = touch.clientY - state.touchStartY;
        if (Math.abs(dx) < 54 || Math.abs(dx) < Math.abs(dy) * 1.15) return;
        moveItem(dx < 0 ? 1 : -1, true);
      }, { passive: true });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[ch]));
    }

    function render() {
      renderScales();
      renderEditor();
    }

    $("enterBtn").addEventListener("click", showMain);
    $("coverBtn").addEventListener("click", showCover);
    $("coverNewBtn").addEventListener("click", addScale);
    $("newScaleBtn").addEventListener("click", addScale);
    $("newScaleTopBtn").addEventListener("click", addScale);
    $("modalCancel").addEventListener("click", () => closeTextModal(null));
    $("modalOk").addEventListener("click", () => closeTextModal($("modalInput").value.trim()));
    $("modalInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") closeTextModal($("modalInput").value.trim());
    });

    async function start() {
      state.db = await openDb();
      await loadData();
      state.selectedScaleId = state.scales[0]?.id || null;
      state.selectedItemId = selectedScale()?.items[0]?.id || null;
      state.selectedOptionId = selectedItem()?.options[0]?.id || null;
      render();
    }

    start().catch((error) => {
      alert(`初始化失败：${error.message}`);
    });
  </script>
</body>
</html>
